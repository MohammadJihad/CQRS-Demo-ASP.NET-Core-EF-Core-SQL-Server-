# Isolated SQL Server for the CQRS learning sample.
# Requires an x64 (amd64) Docker host, or Apple Silicon with Rosetta/x86 emulation enabled.
# Copy .env.example to .env and set MSSQL_SA_PASSWORD before starting.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cqrsdemo-sqlserver
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "${MSSQL_PORT:-14330}:1433"
    volumes:
      - cqrsdemo-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  cqrsdemo-sqldata:
